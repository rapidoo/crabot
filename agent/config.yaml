# Model names are resolved from MODEL_NAME env var (GEMMA4 | MISTRAL).
# Override individual models here if needed.
models:
  ollama_base_url: http://localhost:11434

sampling:
  default:  { temperature: 1.0, top_p: 0.95, top_k: 64 }
  planner:  { temperature: 0.7, top_p: 0.95, top_k: 64 }
  critic:   { temperature: 0.3, top_p: 0.9,  top_k: 32 }

thinking:
  triage:   false
  planner:  true
  executor: false
  critic:   true

thresholds:
  min_score:        6.5
  max_retries:      3
  parallel_steps:   true

skeleton:
  enabled:          true
  token_threshold:  500

speculative:
  enabled:          true
  max_input_tokens: 200
  tools_bypass:     ["code", "search"]

vision:
  token_budget_ocr:    1120
  token_budget_default: 280
  token_budget_fast:    70

recovery:
  persist_cursor:   true
  state_file:       ./state/agent_state.json
  atomic_write:     true

memory:
  neo4j_uri:        bolt://localhost:7687
  neo4j_user:       neo4j
  neo4j_password:   ""              # Loaded from .env NEO4J_PASSWORD
  context_k:        5
  write_threshold:  5.0
  read_threshold:   6.5
  entity_extraction: true
  embedding_model:  nomic-embed-text
  embedding_dimensions: 768
  vector_weight:    0.7
  lexical_weight:   0.3

context:
  max_tokens_per_call: 32768
  skeleton_threshold:  500
  trace_in_context:    true
  compression_threshold: 0.50      # Compress when history exceeds 50% of budget
  compression_protect_last_n: 4    # Always keep last 4 exchanges in full

telegram:
  bot_token: ""                # Loaded from .env TELEGRAM_BOT_TOKEN
  allowed_users: []            # User IDs autorisés (vide = tout le monde)
  max_message_length: 4000

daemon:
  max_concurrent: 3            # Max requêtes agent simultanées
  request_timeout: 300         # Timeout par requête (5 min)

logging:
  level: INFO
  trace_file: ./logs/agent_trace.jsonl

scheduler:
  enabled: true
  cron_tasks:
    - name: daily_reflection
      schedule: "0 2 * * *"
      prompt: "Run reflection cycle on last 50 episodes"
      schedule_type: cron
  watch_paths: []
  self_schedule: true

feedback:
  enabled: true
  good_score: 9.0
  bad_score: 2.0

adaptive:
  enabled: true
  min_samples: 20
  threshold_method: mean_minus_std

reflection:
  enabled: false
  last_n_episodes: 50
  auto_apply: true

evolution:
  enabled: false
  max_mutations_per_cycle: 3
  overrides_file: ./state/overrides.yaml
  mutations_log: ./state/mutations.jsonl
  protected_roles: ["critic"]

approval:
  enabled: true                    # Confirm dangerous tool actions (interactive mode)

truncation:
  enabled: true                    # Truncate oversized tool outputs
  max_chars: 50000                 # Max characters per tool output
  tail_chars: 2000                 # Preserve last N chars when truncating
