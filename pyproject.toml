[project]
name = "nano-agent"
version = "0.1.0"
description = "100% local AI agent using Ollama — Plan → Execute → Critique pattern"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
memory = ["neo4j>=5.0"]
telegram = ["python-telegram-bot>=21.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires Ollama running locally",
    "neo4j: requires Neo4j running locally",
]

[tool.mypy]
strict = true
